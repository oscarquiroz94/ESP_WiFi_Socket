<!DOCTYPE html>
<html>
  <head>
    <style>
      button { display: block; margin-bottom: 10px; }
      textarea { width: 100%; height: 200px; margin-top: 10px; }
    </style>
  </head>
  <body>
    <h2>Cliente WebSocket</h2>
    <button onclick="sendAttach()">Enviar attach</button>
    <button onclick="sendGetData()">Enviar getData</button>

    <!-- Agregado: campo de texto para los mensajes -->
    <textarea id="text" readonly></textarea>

    <script>
      let socket = new WebSocket("ws://192.168.4.1:8080");

      socket.onopen = () => {
        let msg = { device: "visualscope" };
        socket.send(JSON.stringify(msg));
        console.log("✅ Conectado al servidor");
      };

      socket.onmessage = (event) => {
        const ta = document.getElementById("text");
        ta.value += event.data + "\n";
        ta.scrollTop = ta.scrollHeight;
        console.log("📩 Mensaje recibido:", event.data);
      };

      socket.onerror = (err) => {
        console.error("❌ Error:", err);
      };

      function sendGetData() {
        let msg = { id: 123, roasterID: 1, command: "getData" };
        socket.send(JSON.stringify(msg));
        console.log("➡️ Enviado:", msg);
      }

      function sendAttach() {
        let msg = { deviceid: 123, command: "attach", devicename: "audiocrack" };
        socket.send(JSON.stringify(msg));
        console.log("➡️ Enviado:", msg);
      }
    </script>
  </body>
</html>
